name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK (F-Droid flavor)
        run: ./gradlew :presentation:assembleFdroidDebug --stacktrace

      - name: Build debug APK (Playstore flavor, includes Google Drive)
        run: ./gradlew :presentation:assemblePlaystoreDebug --stacktrace

      - name: Upload F-Droid APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptomator-fdroid-debug-apk
          path: presentation/build/outputs/apk/fdroid/**/*.apk

      - name: Upload Playstore APK
        uses: actions/upload-artifact@v4
        with:
          name: cryptomator-playstore-debug-apk
          path: presentation/build/outputs/apk/playstore/**/*.apk
